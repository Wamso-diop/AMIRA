<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Banque — notification éphémère</title>
<style>.toast{position:fixed;bottom:16px;right:16px;background:#222;color:#fff;padding:10px}</style></head>
<body>
<h1>Historique</h1>
<p>Vos trois dernières opérations apparaissent ci-dessous.</p>
<ol><li>Paiement marchand de 3 500 FCFA</li><li>Retrait de 10 000 FCFA</li></ol>
<div id="live" aria-live="polite"></div>
<button id="go">Afficher la notification</button>
<script>
document.getElementById('go').addEventListener('click', () => {
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status');
  t.textContent = 'Transfert de 5 000 FCFA envoyé avec succès.';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
  document.getElementById('live').textContent = 'Erreur réseau : la synchronisation a échoué, réessayez.';
});
window.__fixtures = ['3 500 FCFA','10 000 FCFA','5 000 FCFA'];
</script>
</body></html>
